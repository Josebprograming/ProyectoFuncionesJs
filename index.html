<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Consola para demostrar funciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Aplicación de Consola para demostrar funciones</h1>
        </div>
    </header>
    <section>
        <div class="container_contenido">
            <h2>Funciones</h2>
            <p>Esta aplicación de consola demuestra el uso de funciones en JavaScript. Al hacer clic en el botón
                "Ejecutar Funciones", se llamarán varias funciones que realizan diferentes tareas y muestran sus
                resultados en la consola del navegador.</p>
            <button id="runFunctionsBtn">Ejecutar Funciones</button>
        </div>
    </section>





    <script src="main.js"></script>
</body>

</html>
